name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and publish as a GitHub prerelease
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Verify tag and package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$package_version"
      - name: Test and build
        run: |
          uv sync --extra dev --locked
          uv run pytest -q
          uv build
      - name: Create or refresh GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber dist/*.whl dist/*.tar.gz
          else
            gh release create "$RELEASE_TAG" --prerelease --generate-notes \
              --title "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
          fi

# PyPI publication is intentionally separate until Q00/contractplane has a
# project-scoped Trusted Publisher. Add an OIDC-only publish job after that
# one-time registry setup; do not add a long-lived PyPI token to this repo.

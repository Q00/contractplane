apiVersion: contractplane.dev/v1alpha1
kind: DomainPack
metadata: {name: invalid-reference, version: 0.1.0, description: Invalid references.}
defaultPolicy: standard
capabilities:
  - id: noop
    kind: deterministic
    description: No-op capability.
    sideEffects: none
    inputSchema: {}
    outputSchema: {}
    permissions: []
roles: []
evidence:
  - id: receipt
    kind: artifact
    description: Placeholder evidence.
policies:
  - id: standard
    description: Evidence required.
    evidenceRequired: true
    humanApproval: never
    maxAttempts: 1
flows:
  - id: broken
    description: References a missing capability and evidence contract.
    inputSchema: {}
    stages:
      - id: work
        description: Broken work.
        capability: missing-capability
        needs: []
        fanout: {mode: singleton}
        requiresEvidence: [missing-evidence]
        produces: [output]
entrypoints:
  - id: broken-entry
    description: Broken entrypoint.
    flow: missing-flow
    keywords: [broken]
    examples: [Run broken flow.]

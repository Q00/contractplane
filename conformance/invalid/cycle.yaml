apiVersion: contractplane.dev/v1alpha1
kind: DomainPack
metadata: {name: invalid-cycle, version: 0.1.0, description: Invalid cyclic flow.}
defaultPolicy: standard
capabilities:
  - id: noop
    kind: deterministic
    description: No-op capability.
    sideEffects: none
    inputSchema: {}
    outputSchema: {}
    permissions: []
roles: []
evidence:
  - id: receipt
    kind: artifact
    description: Placeholder evidence.
policies:
  - id: standard
    description: Evidence required.
    evidenceRequired: true
    humanApproval: never
    maxAttempts: 1
flows:
  - id: cyclic
    description: Invalid cycle.
    inputSchema: {}
    stages:
      - id: first
        description: First stage.
        capability: noop
        needs: [second]
        fanout: {mode: singleton}
        requiresEvidence: [receipt]
        produces: [first-output]
      - id: second
        description: Second stage.
        capability: noop
        needs: [first]
        fanout: {mode: singleton}
        requiresEvidence: [receipt]
        produces: [second-output]
entrypoints:
  - id: cyclic-entry
    description: Invalid entrypoint.
    flow: cyclic
    keywords: [cycle]
    examples: [Run the cycle.]
